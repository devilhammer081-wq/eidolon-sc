# 外出地点目录（GLOSSARY.md「外出」）。和礼物目录一样由维护者在这里维护，后台和 .env 都
# 不能改；启动时读入、校验，写错了后端起不来。
#
# 每个地点一个 [[locations]] 段：
#   id        规范标识（小写字母、数字、- 和 _）；地点头图是 frontend/public/outings/<id>.png
#   name      通用中文名
#   scene     场景描述（喂 LLM 的地点设定）：光线、声音、气味、常见的动静
#   affinity  好感倾向提示：结算同行好感时（见 affinity 模块）这个地点让好感往哪边偏、
#             偏多少的一句话，随结算 prompt 一起给模型
#   place_categories  地点池 places.toml 里的类别：偶遇按角色 place_likes 加权抽取时，
#             这个外出地点算她喜欢的哪几类
#
#   每个事件一个 [[locations.events]] 段（每地至少一件，v1 配了 3–4 件）：
#     id        事件标识（地点内唯一）
#     trigger   一句触发语，事件卡上显示的就是它
#     prompt    LLM 场景提示：事件发生时按它生成场景和角色反应
#     affinity  好感倾向提示：这件事让好感往哪边偏的一句话，随结算 prompt 给模型

[[locations]]
id = "cinema"
name = "电影院"
scene = "影院大堂灯暗下来后的余光、爆米花的甜味和走廊尽头放映厅漏出的声浪。放映厅里座席一排排升高，银幕的光在每个人脸上明灭，黑暗里只有压低的耳语和座椅轻轻的吱呀。散场时人潮涌向出口，夜风混着讨论声一起灌进来。"
affinity = "黑暗里并肩坐着的两个小时不用找话，谁也不尴尬；一起看过的片子过后都记得，好感容易往上走。"
place_categories = ["mall"]

[[locations.events]]
id = "pick-a-film"
trigger = "选片争执"
prompt = "海报墙前大家想看的片子不一样：有人想看催泪的，有人想看动作片，还有人根本不想看任何一部。让她们各自摆出理由，从各自的性子出发争，最后有人让步或有人赌气买票。"
affinity = "争归争，肯陪对方看自己不想看的片子，好感反而更往上走。"

[[locations.events]]
id = "spilled-popcorn"
trigger = "爆米花洒了"
prompt = "递爆米花时手一歪，撒了一地，也撒到了谁身上。让在意的人小声惊呼、大方的人笑着弯腰去捡，工作人员拿着扫帚过来前的手忙脚乱。"
affinity = "一起收拾狼狈的小事故，多半会让好感往上走一点。"

[[locations.events]]
id = "tears-at-the-end"
trigger = "散场时谁哭了"
prompt = "灯亮起来，有谁被片子弄出了眼泪，正慌忙擦掉装作没事。让其他人有的憋笑、有的递纸巾、有的假装没看见，各按和她的关系来。"
affinity = "看见了也不取笑、只悄悄递纸巾的话，好感往上走。"

[[locations.events]]
id = "after-credits"
trigger = "彩蛋等到最后"
prompt = "字幕滚动，人都走空了，有人坚持要等彩蛋。让性急的不断催、较真的纹丝不动，彩蛋到底来没来留给她们自己反应。"
affinity = "陪着急性子等完一场空，或等来了惊喜，好感都容易往上走。"

[[locations]]
id = "mall"
name = "商场"
scene = "中庭的天光从玻璃顶棚落下来，扶梯一层层往上叠，广播和人群的嗡嗡声混在一起。橱窗里的陈列一季一换，试衣间外抱着衣服等人，美食街的香气在顶层等着。周末的人流里并肩走着，一回头人就容易被冲开。"
affinity = "人来人往里要一直留意彼此，逛的都是对方的喜好，好感随逛随涨。"
place_categories = ["mall"]

[[locations.events]]
id = "lost-each-other"
trigger = "走散了"
prompt = "一转身身边空了，人潮里谁也找不见谁。让走散的人原地站着等、急性子到处钻、稳的人去服务台广播寻人，重聚时各自的后怕和埋怨。"
affinity = "找到时那种松一口气，让好感往上走。"

[[locations.events]]
id = "trying-on-clothes"
trigger = "试衣间外的意见"
prompt = "有人拎着一沓衣服进了试衣间，出来一件问一次好不好看。让说实话的和专挑好听说的当场分成两派，被评价的人自己心里也有一杆秤。"
affinity = "敢说真话又肯替她着想的好感往上走，敷衍的讨不了好。"

[[locations.events]]
id = "claw-machine"
trigger = "夹娃娃机前"
prompt = "路过的夹娃娃机里躺着一只怎么看怎么好抓的玩偶。让不服输的一枚接一枚投币、理智的计算爪子角度、看破的劝人省点钱，围观的人比玩的人还紧张。"
affinity = "夹上来送人的那一刻，好感往上走一大截。"

[[locations.events]]
id = "shared-portion"
trigger = "美食街分食"
prompt = "顶楼美食街，点的东西太多只好互相分。让胃口小的只尝一口、胃口大的护着自己的碗、讲究的在意谁用了谁的叉子，一顿饭吃出各自的性子。"
affinity = "肯把自己那份分出来的，好感往上走。"

[[locations]]
id = "amusement-park"
name = "游乐场"
scene = "旋转木马的音乐和过山车的尖叫从四面八方轮番压过来，气球在人头顶上飘。排队的人群里晒着太阳闻着可丽饼的甜味，地图摊开在手上也认不清方向。天黑后花车和灯一盏盏亮起来，出口前的纪念品店是最后一关。"
affinity = "肾上腺素和排队时说不完的话，让好感比平时涨得都快。"
place_categories = ["amusement"]

[[locations.events]]
id = "roller-coaster"
trigger = "过山车前的队"
prompt = "过山车底下排队，有人腿软了想退、有人跃跃欲试、有人嘴硬说不害怕。让胆小的被连拖带劝地架上座位，下车时谁头发乱了、谁嗓子哑了、谁还想再来一次。"
affinity = "吓哭了也有人陪着走完全程，好感往上走。"

[[locations.events]]
id = "mascot-photo"
trigger = "人偶合影"
prompt = "园里的人偶晃过来招手合影。让有的人秒变迷妹冲上去、有的人嫌幼稚躲开、有的人面无表情地站进去却在人偶转身时偷偷挥手。"
affinity = "看清了谁嘴硬心软，好感悄悄往上走。"

[[locations.events]]
id = "parade-crush"
trigger = "花车人流"
prompt = "花车巡游一开始，人流从四面涌过来把人挤散挤歪。让个子小的被挤得看不见、伸手去拉人的、把人护在身前的，花车过完才找得回彼此。"
affinity = "乱糟糟里还牢牢牵着手的，好感往上走。"

[[locations.events]]
id = "won-a-prize"
trigger = "摊位中了个大奖"
prompt = "套圈或射球的摊位上，随手一玩竟中了个大到抱不动的大奖。让摊主比玩家还惊讶、同行的人起哄要把奖品给谁，谁来抱着它走完剩下的路。"
affinity = "中奖的运气分给了大家，好感都往上走。"

[[locations]]
id = "seaside"
name = "海边"
scene = "海风带着咸味把头发吹乱，浪一遍遍推上沙滩又退回去，留下湿亮的痕和零星的贝壳。防晒霜的气味、远处海鸥的叫声、脚下被晒暖的沙。傍晚天色一层层压下来，防波堤上坐着的人影被拉得很长。"
affinity = "开阔的地方心也跟着开阔，平时不说的话在海边说得出口，好感容易往上走。"
place_categories = ["seaside"]

[[locations.events]]
id = "wave-incoming"
trigger = "浪打过来"
prompt = "只顾看海没留意潮水，一个浪头打上来鞋和裤脚全湿。让跳着躲开的笑蹲在原地的、湿了的人追着笑得最响的跑，狼狈在沙滩上传染。"
affinity = "一起狼狈过，好感往上走。"

[[locations.events]]
id = "shell-hunting"
trigger = "捡贝壳"
prompt = "退潮后的沙滩上散着贝壳，有人低头一枚枚挑、有人非要找枚完整的、有人捡了满手又都说不要。让她们互相把找到的分给对方，或把自己最中意的那枚留着不给。"
affinity = "把最中意的那枚让出去，好感往上走。"

[[locations.events]]
id = "sunset-walk"
trigger = "日落时分"
prompt = "太阳一点点沉下去，天从金红压到蓝紫。让话少的人这时候也开了口，说些平时不说的；性子闹的也安静下来。谁先说该回去了，谁装作没听见。"
affinity = "一起看完一场日落，好感往上走一大截。"

[[locations.events]]
id = "sand-castle"
trigger = "堆沙堡"
prompt = "有人蹲下来开始堆沙堡，堆着堆着所有人都围了过来，挖护城河的、找树枝当旗杆的、只负责评价的。涨潮的浪头正在远处等着。"
affinity = "一起认真做过一件没用的小事，好感往上走。"
